name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build

      - name: configure
        run: cmake -B build -G Ninja

      - name: build
        run: cmake --build build

      - name: test
        run: ctest --test-dir build --output-on-failure
